apiVersion: v1
kind: Service
metadata:
  labels:
    app: frontend
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
  name: frontend
  namespace: kp
spec:
  ports:
  - port: 80
    targetPort: 80
  selector:
    app: frontend
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: control
  name: api
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        kp.retailpartnerx.io/plane: control
    spec:
      containers:
      - env:
        - name: LLM_PROVIDER
          value: MOCK
        - name: LLM_MODEL
          value: qwen2.5:0.5b
        - name: OPENAI_BASE_URL
          value: http://host.docker.internal:11434/v1
        - name: STORE_BACKEND
          value: live
        - name: EMBEDDING_PROVIDER
          value: MOCK
        - name: DEMO_AUTH_ENABLED
          value: 'true'
        - name: ENABLE_SEMANTIC_CACHE
          value: 'false'
        - name: LLM_ALLOW_RUNTIME_URL_OVERRIDE
          value: 'false'
        - name: NEO4J_URI
          value: fixture-value
        - name: QDRANT_URL
          value: http://qdrant:6333
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: MINIO_ENDPOINT
          value: minio:9000
        - name: POSTGRES_DSN
          value: fixture-value
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://host.docker.internal:4318
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        image: kp-api:dev
        imagePullPolicy: Never
        name: api
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
    kp.retailpartnerx.io/plane: data
  name: postgres
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
      - env:
        - name: POSTGRES_USER
          value: kp
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: kp-secrets
        - name: POSTGRES_DB
          value: knowledge
        image: postgres:16-alpine
        name: postgres
        ports:
        - containerPort: 5432
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-postgres-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: neo4j
    kp.retailpartnerx.io/plane: data
  name: neo4j
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
      - env:
        - name: NEO4J_AUTH
          value: neo4j/retailpartnerx
        - name: NEO4J_server_config_strict__validation_enabled
          value: 'false'
        image: neo4j:5.26-community
        name: neo4j
        ports:
        - containerPort: 7474
        - containerPort: 7687
        volumeMounts:
        - mountPath: /data
          name: data
      enableServiceLinks: false
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-neo4j-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qdrant
    kp.retailpartnerx.io/plane: data
  name: qdrant
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
      - image: qdrant/qdrant:v1.13.2
        name: qdrant
        ports:
        - containerPort: 6333
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-qdrant-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
    kp.retailpartnerx.io/plane: data
  name: redis
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
      - image: redis:7-alpine
        name: redis
        ports:
        - containerPort: 6379
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: minio
    kp.retailpartnerx.io/plane: data
  name: minio
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
      - env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_USER
              name: kp-secrets
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_PASSWORD
              name: kp-secrets
        - name: MINIO_DEFAULT_BUCKETS
          value: knowledge-platform
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        name: minio
        ports:
        - containerPort: 9000
        - containerPort: 9001
        volumeMounts:
        - mountPath: /bitnami/minio/data
          name: data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-minio-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: frontend
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: edge
  name: frontend
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        kp.retailpartnerx.io/plane: edge
    spec:
      containers:
      - image: kp-frontend:dev
        imagePullPolicy: Never
        name: frontend
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
    nginx.ingress.kubernetes.io/proxy-buffering: 'off'
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: 'true'
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
  name: kp-api
  namespace: kp
spec:
  ingressClassName: nginx
  rules:
  - host: kp.local
    http:
      paths:
      - backend:
          service:
            name: api
            port:
              number: 8080
        path: /api(/|$)(.*)
        pathType: ImplementationSpecific
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 20m
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
  name: kp-ui
  namespace: kp
spec:
  ingressClassName: nginx
  rules:
  - host: kp.local
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
