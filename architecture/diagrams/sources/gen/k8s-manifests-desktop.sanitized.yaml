          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /data
          name: data
      securityContext:
        fsGroup: 999
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: minio
    kp.retailpartnerx.io/plane: data
  name: minio
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        kp.retailpartnerx.io/plane: data
        kp.retailpartnerx.io/writable-rootfs: image-entrypoint-writes-config
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: MINIO_ROOT_USER
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_USER
              name: kp-secrets
        - name: MINIO_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_PASSWORD
              name: kp-secrets
        - name: MINIO_DEFAULT_BUCKETS
          value: knowledge-platform
        image: bitnamilegacy/minio:2025.7.23-debian-12-r5
        name: minio
        ports:
        - containerPort: 9000
        - containerPort: 9001
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /bitnami/minio/data
          name: data
        - mountPath: /opt/bitnami/minio/tmp
          name: runtime
          subPath: tmp
        - mountPath: /opt/bitnami/minio/secrets
          name: runtime
          subPath: secrets
        - mountPath: /opt/bitnami/minio/log
          name: runtime
          subPath: log
        - mountPath: /.mc
          name: runtime
          subPath: mc
      securityContext:
        fsGroup: 1001
        runAsGroup: 1001
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-minio-data
      - emptyDir: {}
        name: runtime
