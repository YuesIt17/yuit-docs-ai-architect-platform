apiVersion: v1
kind: Namespace
metadata:
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: mixed
  name: kp
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: data
  name: kp-data-plane-ingress
  namespace: kp
spec:
  egress:
  - {}
  ingress:
  - from:
    - podSelector:
        matchLabels:
          kp.retailpartnerx.io/plane: control
    ports:
    - port: 5432
      protocol: TCP
    - port: 6379
      protocol: TCP
    - port: 6333
      protocol: TCP
    - port: 7474
      protocol: TCP
    - port: 7687
      protocol: TCP
    - port: 9000
      protocol: TCP
  podSelector:
    matchLabels:
      kp.retailpartnerx.io/plane: data
  policyTypes:
  - Ingress
  - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: control
  name: kp-control-plane-egress
  namespace: kp
spec:
  egress:
  - to:
    - podSelector:
        matchLabels:
          kp.retailpartnerx.io/plane: data
  - ports:
    - port: 53
      protocol: UDP
    - port: 53
      protocol: TCP
    to:
    - namespaceSelector: {}
  podSelector:
    matchLabels:
      kp.retailpartnerx.io/plane: control
  policyTypes:
  - Egress
---
apiVersion: v1
data: {}
kind: Secret
metadata:
  labels:
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
  name: kp-secrets
  namespace: kp
stringData:
  JWT_SECRET: fixture-value
  MINIO_ROOT_PASSWORD: fixture-value
  MINIO_ROOT_USER: fixture-value
  NEO4J_PASSWORD: fixture-value
  POSTGRES_PASSWORD: fixture-value
type: Opaque
---
