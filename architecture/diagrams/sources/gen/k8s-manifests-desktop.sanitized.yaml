apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: api
    app.kubernetes.io/instance: kp
    app.kubernetes.io/name: knowledge-platform
    app.kubernetes.io/part-of: retailpartnerx-kp
    kp.retailpartnerx.io/plane: control
  name: api
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        kp.retailpartnerx.io/plane: control
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: LLM_PROVIDER
          value: MOCK
        - name: LLM_MODEL
          value: qwen2.5:0.5b
        - name: OPENAI_BASE_URL
          value: http://host.docker.internal:11434/v1
        - name: STORE_BACKEND
          value: live
        - name: OCR_PROVIDER
          value: MOCK
        - name: EMBEDDING_PROVIDER
          value: MOCK
        - name: DEMO_AUTH_ENABLED
          value: 'true'
        - name: ENABLE_SEMANTIC_CACHE
          value: 'false'
        - name: LLM_ALLOW_RUNTIME_URL_OVERRIDE
          value: 'false'
        - name: NEO4J_URI
          value: fixture-value
        - name: QDRANT_URL
          value: http://qdrant:6333
        - name: REDIS_URL
          value: redis://redis:6379/0
        - name: MINIO_ENDPOINT
          value: minio:9000
        - name: POSTGRES_DSN
          valueFrom:
            secretKeyRef:
              key: POSTGRES_DSN
              name: kp-secrets
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              key: JWT_SECRET
              name: kp-secrets
        - name: NEO4J_PASSWORD
          valueFrom:
            secretKeyRef:
              key: NEO4J_PASSWORD
              name: kp-secrets
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_USER
              name: kp-secrets
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              key: MINIO_ROOT_PASSWORD
              name: kp-secrets
        - name: JOB_BACKEND
          value: inline
        - name: HOME
          value: /tmp
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          value: http://host.docker.internal:4318
        - name: OTEL_METRICS_EXPORTER
          value: none
        - name: OTEL_LOGS_EXPORTER
          value: none
        image: kp-api:dev
        imagePullPolicy: Never
        name: api
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /tmp
          name: tmp
        - mountPath: /app/data
          name: object-store-cache
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - emptyDir: {}
        name: tmp
      - emptyDir: {}
        name: object-store-cache
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: postgres
    kp.retailpartnerx.io/plane: data
  name: postgres
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        kp.retailpartnerx.io/plane: data
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_USER
          value: kp
        - name: PGDATA
          value: /var/lib/postgresql/data/pgdata
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: kp-secrets
        - name: POSTGRES_DB
          value: knowledge
        image: postgres:16-alpine
        name: postgres
        ports:
        - containerPort: 5432
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: data
        - mountPath: /var/run/postgresql
          name: run
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 70
        runAsGroup: 70
        runAsNonRoot: true
        runAsUser: 70
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-postgres-data
      - emptyDir: {}
        name: run
      - emptyDir: {}
        name: tmp
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: neo4j
    kp.retailpartnerx.io/plane: data
  name: neo4j
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        kp.retailpartnerx.io/plane: data
        kp.retailpartnerx.io/writable-rootfs: image-entrypoint-writes-config
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: NEO4J_AUTH
          valueFrom:
            secretKeyRef:
              key: NEO4J_AUTH
              name: kp-secrets
        - name: NEO4J_server_config_strict__validation_enabled
          value: 'false'
        image: neo4j:5.26-community
        name: neo4j
        ports:
        - containerPort: 7474
        - containerPort: 7687
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /data
          name: data
      enableServiceLinks: false
      securityContext:
        fsGroup: 7474
        runAsGroup: 7474
        runAsNonRoot: true
        runAsUser: 7474
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-neo4j-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: qdrant
    kp.retailpartnerx.io/plane: data
  name: qdrant
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        kp.retailpartnerx.io/plane: data
        kp.retailpartnerx.io/writable-rootfs: app-writes-init-marker
    spec:
      automountServiceAccountToken: false
      containers:
      - image: qdrant/qdrant:v1.13.2-unprivileged
        name: qdrant
        ports:
        - containerPort: 6333
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
        volumeMounts:
        - mountPath: /qdrant/storage
          name: data
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: kp-qdrant-data
---
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: redis
    kp.retailpartnerx.io/plane: data
  name: redis
  namespace: kp
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        kp.retailpartnerx.io/plane: data
    spec:
      automountServiceAccountToken: false
      containers:
      - image: redis:7-alpine
        name: redis
        ports:
        - containerPort: 6379
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
