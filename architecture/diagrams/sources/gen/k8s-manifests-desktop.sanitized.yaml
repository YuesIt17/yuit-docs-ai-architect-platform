    app.kubernetes.io/part-of: retailpartnerx-kp
  name: kp-ui
  namespace: kp
spec:
  ingressClassName: nginx
  rules:
  - host: kp.local
    http:
      paths:
      - backend:
          service:
            name: frontend
            port:
              number: 80
        path: /
        pathType: Prefix
