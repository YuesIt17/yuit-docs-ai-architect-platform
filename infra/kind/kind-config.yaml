# Single-node kind: Docker Desktop hostPort mappings are unreliable with a worker
# under load. One control-plane node keeps ingress hostPort on the mapped container.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: retailpartnerx-kp
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 8088
        protocol: TCP
        listenAddress: "127.0.0.1"
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
        listenAddress: "127.0.0.1"
