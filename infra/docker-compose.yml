name: retailpartnerx-kp

networks:
  edge:
    driver: bridge
  control:
    driver: bridge
  data:
    driver: bridge

volumes:
  pg_data:
  neo4j_data:
  qdrant_data:
  redis_data:
  minio_data:

services:
  postgres:
    image: postgres:16-alpine
    profiles: ["core", "demo"]
    environment:
      POSTGRES_USER: kp
      POSTGRES_PASSWORD: kp
      POSTGRES_DB: knowledge
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kp -d knowledge"]
      interval: 5s
      timeout: 5s
      retries: 10

  neo4j:
    image: neo4j:5.26-community
    profiles: ["core", "demo"]
    environment:
      NEO4J_AUTH: neo4j/retailpartnerx
      NEO4J_PLUGINS: '["apoc"]'
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
    networks: [data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  qdrant:
    image: qdrant/qdrant:v1.13.2
    profiles: ["core", "demo"]
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [data]

  redis:
    image: redis:7-alpine
    profiles: ["core", "demo"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks: [data]

  minio:
    image: minio/minio:latest
    profiles: ["core", "demo"]
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks: [data]
  minio-init:
    image: minio/mc:latest
    profiles: ["core", "demo"]
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb -p local/knowledge-platform || true;
      mc anonymous set download local/knowledge-platform/exports || true;
      exit 0;
      "
    networks: [data]

  jaeger:
    image: jaegertracing/all-in-one:1.64
    profiles: ["core", "demo"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [control]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["core", "demo"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [control]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["core", "demo"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [control]
    depends_on:
      - prometheus

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ["core", "demo"]
    env_file:
      - ../.env.example
    environment:
      POSTGRES_DSN: postgresql+asyncpg://kp:kp@postgres:5432/knowledge
      NEO4J_URI: bolt://neo4j:7687
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: minio:9000
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      LLM_PROVIDER: MOCK
      EMBEDDING_PROVIDER: MOCK
      STORE_BACKEND: memory
    ports:
      - "8080:8080"
    networks: [edge, control, data]
    depends_on:
      - postgres
      - neo4j
      - qdrant
      - redis
      - minio
      - jaeger

  seed:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    profiles: ["demo"]
    command: ["python", "-m", "pipelines.seed_all"]
    env_file:
      - ../.env.example
    environment:
      LLM_PROVIDER: MOCK
      EMBEDDING_PROVIDER: MOCK
      STORE_BACKEND: memory
    networks: [data]
    depends_on:
      - api
      - minio-init

  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    networks: [data]

  # GPU host required; enable with --profile llm when hardware available
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["llm"]
    runtime: nvidia
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --max-model-len 4096
      --dtype auto
    ports:
      - "8000:8000"
    networks: [data]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]