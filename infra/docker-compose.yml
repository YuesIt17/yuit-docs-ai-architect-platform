# Hybrid side-stack only — no overlap with Helm/K8s platform.
# K8s owns: api, frontend, postgres, neo4j, qdrant, redis, minio
# Compose owns: ollama (+ optional vllm), prometheus, grafana, jaeger
#
# Full no-K8s stack: infra/docker-compose.standalone.yml (`make demo-standalone`)
name: retailpartnerx-kp

networks:
  control:
    driver: bridge
  data:
    driver: bridge

volumes:
  ollama_data:

services:
  jaeger:
    image: jaegertracing/all-in-one:1.60.0
    profiles: ["obs"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    networks: [control]

  prometheus:
    image: prom/prometheus:v2.55.1
    profiles: ["obs"]
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [control]

  grafana:
    image: grafana/grafana:11.3.0
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [control]
    depends_on:
      - prometheus

  # Default pull: qwen2.5:0.5b. Do not use 7B on a laptop with K8s.
  ollama:
    image: ollama/ollama:latest
    profiles: ["llm"]
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: "5m"
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_FLASH_ATTENTION: "1"
    dns:
      - 8.8.8.8
      - 1.1.1.1
    volumes:
      - ollama_data:/root/.ollama
    networks: [data]
    mem_limit: 3g
    cpus: 2.0
    mem_reservation: 512m

  # GPU host required; --profile llm-gpu
  vllm:
    image: vllm/vllm-openai:latest
    profiles: ["llm-gpu"]
    runtime: nvidia
    environment:
      HUGGING_FACE_HUB_TOKEN: ${HF_TOKEN:-}
    command: >
      --model Qwen/Qwen2.5-7B-Instruct
      --max-model-len 4096
      --dtype auto
    ports:
      - "8000:8000"
    networks: [data]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
