# Docker Desktop Kubernetes overlay (lighter + local images)
images:
  pullPolicy: Never

ingress:
  enabled: true
  host: kp.local
  className: nginx

api:
  env:
    # MinIO in-cluster for label raw/normalized objects
    STORE_BACKEND: live
    EMBEDDING_PROVIDER: MOCK

minio:
  enabled: true
  image: bitnamilegacy/minio:2025.7.23-debian-12-r5
  rootUser: minioadmin
  rootPassword: minioadmin
  args: []

# Ollama stays in Docker Compose (profile llm, qwen2.5:0.5b) — not in Desktop K8s.
llm:
  provider: MOCK
  ollama:
    enabled: false
