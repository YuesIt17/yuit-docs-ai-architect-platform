# Docker Desktop Kubernetes overlay (lighter + local images)
images:
  pullPolicy: Never

ingress:
  enabled: true
  host: kp.local
  className: nginx

api:
  # NodePort for Compose Prometheus scrape (host.docker.internal:30080/metrics)
  serviceType: NodePort
  nodePort: 30080
  env:
    # MinIO in-cluster for label raw/normalized objects
    STORE_BACKEND: live
    EMBEDDING_PROVIDER: MOCK
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4317

minio:
  enabled: true
  image: bitnamilegacy/minio:2025.7.23-debian-12-r5
  rootUser: minioadmin
  rootPassword: minioadmin
  args: []

# Ollama stays in Docker Compose (make llm-ollama) — not in Desktop K8s.
# Hybrid: $env:KP_LLM='compose-ollama' → values-desktop-compose-ollama.yaml
llm:
  provider: MOCK
