{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgres.password | quote }}
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          ports:
            - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
{{- end }}
---
{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: {{ .Values.namespace }}
  labels:
    app: neo4j
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        kp.retailpartnerx.io/plane: data
    spec:
      # K8s service-link env NEO4J_PORT_* is mistaken for Neo4j config keys.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          env:
            - name: NEO4J_AUTH
              value: neo4j/{{ .Values.neo4j.password }}
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          ports:
            - containerPort: 7474
            - containerPort: 7687
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
    - name: bolt
      port: 7687
{{- end }}
