---
{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        kp.retailpartnerx.io/plane: data
    spec:
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          {{- if .Values.minio.args }}
          args: {{ .Values.minio.args | toJson }}
          {{- end }}
          env:
            - name: MINIO_ROOT_USER
              value: {{ .Values.minio.rootUser | quote }}
            - name: MINIO_ROOT_PASSWORD
              value: {{ .Values.minio.rootPassword | quote }}
            - name: MINIO_DEFAULT_BUCKETS
              value: knowledge-platform
          ports:
            - containerPort: 9000
            - containerPort: 9001
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
{{- end }}
