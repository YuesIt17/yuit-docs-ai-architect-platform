# Docker Desktop Kubernetes overlay (lighter + local images)
images:
  pullPolicy: Never

ingress:
  enabled: true
  host: kp.local
  className: nginx

api:
  # NodePort for Compose Prometheus scrape (host.docker.internal:30080/metrics)
  serviceType: NodePort
  nodePort: 30080
  env:
    # MinIO in-cluster for label raw/normalized objects
    STORE_BACKEND: live
    EMBEDDING_PROVIDER: MOCK
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318

neo4j:
  # Browser UI on host for Ops deep links
  serviceType: NodePort
  httpNodePort: 30474

minio:
  enabled: true
  image: bitnamilegacy/minio:2025.7.23-debian-12-r5
  rootUser: minioadmin
  rootPassword: minioadmin
  args: []
  # Console on host for Ops deep links
  serviceType: NodePort
  consoleNodePort: 30901

networkPolicy:
  # Docker Desktop host network, for Prometheus scrapes and the Ops deep links.
  hostAccessCidr: 192.168.65.0/24
  apiEgress:
    # Compose side-stack through host.docker.internal: Ollama, vLLM, Tempo.
    - {cidr: 192.168.65.0/24, ports: [11434, 8000, 4318]}

# Ollama stays in Docker Compose — not in Desktop K8s.
# Hybrid: $env:KP_LLM='compose-ollama' → values-desktop-compose-ollama.yaml
llm:
  provider: MOCK
