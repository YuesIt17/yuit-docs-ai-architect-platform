namespace: kp

images:
  api: kp-api:dev
  frontend: kp-frontend:dev
  pullPolicy: IfNotPresent

# Ollama is Compose-only (`make llm-ollama`); use values-desktop-compose-ollama.yaml for hybrid.
# baseUrl / model are injected as OPENAI_BASE_URL / LLM_MODEL (source of truth — not hardcoded in app).
llm:
  provider: MOCK # MOCK | OLLAMA | VLLM
  baseUrl: http://host.docker.internal:11434/v1
  model: qwen2.5:0.5b

api:
  replicas: 1
  port: 8080
  serviceType: ClusterIP
  nodePort: null
  env:
    STORE_BACKEND: memory
    EMBEDDING_PROVIDER: MOCK
    OCR_PROVIDER: MOCK # MOCK | RAPIDOCR
    DEMO_AUTH_ENABLED: "true"
    ENABLE_SEMANTIC_CACHE: "false"
    LLM_ALLOW_RUNTIME_URL_OVERRIDE: "false"
    # Compose Tempo (make obs) via Docker Desktop host gateway
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318

frontend:
  replicas: 1
  port: 8080

ingress:
  enabled: true
  host: kp.local
  className: nginx

postgres:
  enabled: true
  image: postgres:16-alpine
  user: kp
  password: kp
  database: knowledge

neo4j:
  enabled: true
  image: neo4j:5.26-community
  password: retailpartnerx
  serviceType: ClusterIP
  httpNodePort: null

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.13.2-unprivileged

redis:
  enabled: true
  image: redis:7-alpine

minio:
  enabled: true
  # Official minio/minio often blocked; bitnami/minio is paid-only — use legacy tag.
  image: bitnamilegacy/minio:2025.7.23-debian-12-r5
  rootUser: minioadmin
  rootPassword: minioadmin
  # bitnami entrypoint; leave empty (do not pass minio server args)
  args: []
  serviceType: ClusterIP
  consoleNodePort: null

persistence:
  enabled: true
  postgresSize: 5Gi
  neo4jSize: 5Gi
  qdrantSize: 5Gi
  minioSize: 10Gi

podSecurity:
  # Enforced by the API server through namespace labels.
  level: restricted

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  # Host network allowed to reach NodePorts. Empty blocks it.
  hostAccessCidr: ""
  # Allowed egress from the API beyond the stores, as {cidr, ports}, such as an LLM or tracing host.
  apiEgress: []
  stores:
    - {app: postgres, ports: [5432]}
    - {app: neo4j, ports: [7474, 7687], hostPorts: [7474, 7687]}
    - {app: qdrant, ports: [6333]}
    - {app: redis, ports: [6379]}
    - {app: minio, ports: [9000, 9001], hostPorts: [9001]}

# Admission policies. Install Kyverno first: see docs/infra/k8s-hardening.md.
kyverno:
  enabled: false

resources:
  api:
    requests:
      cpu: 100m
      memory: 256Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
