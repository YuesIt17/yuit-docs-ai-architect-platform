namespace: kp

images:
  api: kp-api:dev
  frontend: kp-frontend:dev
  bff: kp-bff:dev
  keycloak: kp-keycloak:dev
  pullPolicy: IfNotPresent

# Ollama is Compose-only (`make llm-ollama`); use values-desktop-compose-ollama.yaml for hybrid.
# baseUrl / model are injected as OPENAI_BASE_URL / LLM_MODEL (source of truth — not hardcoded in app).
llm:
  provider: MOCK # MOCK | OLLAMA | VLLM
  baseUrl: http://host.docker.internal:11434/v1
  model: qwen2.5:0.5b

api:
  replicas: 1
  port: 8080
  serviceType: ClusterIP
  nodePort: null
  env:
    STORE_BACKEND: memory
    EMBEDDING_PROVIDER: MOCK
    OCR_PROVIDER: MOCK # MOCK | RAPIDOCR
    DEMO_AUTH_ENABLED: "true"
    ENABLE_SEMANTIC_CACHE: "false"
    LLM_ALLOW_RUNTIME_URL_OVERRIDE: "false"
    # Compose Tempo (make obs) via Docker Desktop host gateway
    OTEL_EXPORTER_OTLP_ENDPOINT: http://host.docker.internal:4318

frontend:
  replicas: 1
  port: 8080

# Real login: a backend-for-frontend holds the tokens, and the API validates each one. Off: demo role switcher.
# Turning it on sets DEMO_AUTH_ENABLED=false on the API. See architecture/adr/ADR-010-bff-auth.md.
bff:
  enabled: false
  replicas: 1
  port: 8080
  # Probes and /metrics, never routed by the Ingress.
  adminPort: 9090
  # Set this NodePort so Prometheus outside the cluster can scrape the admin port.
  metricsNodePort: null
  # The origin the browser uses. It must be https, or http on *.localhost, or the session cookie is dropped.
  publicUrl: ""
  sessionTtl: 8h
  # A separate database from the API's job queue.
  redisUrl: redis://redis:6379/1
  # 32 random bytes in base64 (`openssl rand -base64 32`). There is no default on purpose.
  sessionEncryptionKey: ""
  oidc:
    # Empty: the bundled Keycloak. Set it to use an external IdP.
    issuerUrl: ""
    clientId: kp-bff
    clientSecret: ""
    # The `aud` the API requires in access tokens.
    audience: kp-api

# A demo IdP with an embedded database, re-imported at each start. Needs bff.enabled. Not for production.
keycloak:
  enabled: false
  realm: kp
  # Plain-HTTP dev needs "none". Use "external" or "all" behind TLS.
  sslRequired: external
  accessTokenLifespan: 300
  adminUser: admin
  adminPassword: ""
  javaHeapOpts: "-Xms128m -Xmx384m"
  # One per role. values-desktop-oidc.yaml sets them with local demo passwords.
  demoUsers: []

ingress:
  enabled: true
  host: kp.local
  className: nginx

postgres:
  enabled: true
  image: postgres:16-alpine
  user: kp
  password: kp
  database: knowledge

neo4j:
  enabled: true
  image: neo4j:5.26-community
  password: retailpartnerx
  serviceType: ClusterIP
  httpNodePort: null

qdrant:
  enabled: true
  image: qdrant/qdrant:v1.13.2-unprivileged

redis:
  enabled: true
  image: redis:7-alpine

minio:
  enabled: true
  # Official minio/minio often blocked; bitnami/minio is paid-only — use legacy tag.
  image: bitnamilegacy/minio:2025.7.23-debian-12-r5
  rootUser: minioadmin
  rootPassword: minioadmin
  # bitnami entrypoint; leave empty (do not pass minio server args)
  args: []
  serviceType: ClusterIP
  consoleNodePort: null

persistence:
  enabled: true
  postgresSize: 5Gi
  neo4jSize: 5Gi
  qdrantSize: 5Gi
  minioSize: 10Gi

podSecurity:
  # Enforced by the API server through namespace labels.
  level: restricted

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx
  # Host network allowed to reach NodePorts. Empty blocks it.
  hostAccessCidr: ""
  # Allowed egress from the API beyond the stores, as {cidr, ports}, such as an LLM or tracing host.
  apiEgress: []
  # Allowed egress from the BFF beyond the API, Redis and Keycloak, such as a tracing host or an external IdP.
  bffEgress: []
  stores:
    - {app: postgres, ports: [5432]}
    - {app: neo4j, ports: [7474, 7687], hostPorts: [7474, 7687]}
    - {app: qdrant, ports: [6333]}
    - {app: redis, ports: [6379]}
    - {app: minio, ports: [9000, 9001], hostPorts: [9001]}

# Admission policies. Install Kyverno first: see docs/infra/k8s-hardening.md.
kyverno:
  enabled: false

secrets:
  # helm: from these values, for a local demo. external-secrets: from Vault (docs/infra/secrets.md).
  provider: helm
  vault:
    server: http://vault.vault.svc:8200
    kvMount: secret
    databaseMount: database
    databaseRole: kp-api
    role: kp-eso
    staticRefresh: 1h
    # Shorter than the role's 1h default_ttl.
    dynamicRefresh: 30m

# Celery worker for catalog ingest. Off: jobs run inside the API process.
worker:
  enabled: false
  replicas: 1
  concurrency: 2

resources:
  worker:
    requests:
      cpu: 100m
      memory: 256Mi
  api:
    requests:
      cpu: 100m
      memory: 256Mi
  frontend:
    requests:
      cpu: 50m
      memory: 64Mi
  bff:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      memory: 128Mi
  keycloak:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 768Mi
