{{- if .Values.networkPolicy.enabled }}
{{- /*
Default-deny with explicit allowlists. Enforcement requires a CNI that supports NetworkPolicy,
such as Calico or Cilium. The default Docker Desktop CNI accepts these objects but does not enforce them.
*/ -}}
{{- $ns := .Values.namespace }}
{{- $labels := include "kp.labels" . }}
{{- $ingressNs := .Values.networkPolicy.ingressNamespace }}
{{- $hostCidr := .Values.networkPolicy.hostAccessCidr }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-default-deny
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Ingress", "Egress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-allow-dns
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-frontend
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNs }}
      ports:
        - protocol: TCP
          port: {{ .Values.frontend.port }}
  {{- if not .Values.bff.enabled }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  {{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-api
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: api
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        {{- if .Values.bff.enabled }}
        - podSelector:
            matchLabels:
              app: bff
        {{- else }}
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNs }}
        - podSelector:
            matchLabels:
              app: frontend
        {{- if $hostCidr }}
        - ipBlock:
            cidr: {{ $hostCidr }}
        {{- end }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
  egress:
    {{- range $store := .Values.networkPolicy.stores }}
    - to:
        - podSelector:
            matchLabels:
              app: {{ $store.app }}
      ports:
        {{- range $port := $store.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
    {{- if .Values.keycloak.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- range $rule := .Values.networkPolicy.apiEgress }}
    - to:
        - ipBlock:
            cidr: {{ $rule.cidr }}
      ports:
        {{- range $port := $rule.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
{{- range $store := .Values.networkPolicy.stores }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-{{ $store.app }}
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: {{ $store.app }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: api
        {{- if $.Values.worker.enabled }}
        - podSelector:
            matchLabels:
              app: worker
        {{- end }}
        {{- if and $.Values.bff.enabled (eq $store.app "redis") }}
        - podSelector:
            matchLabels:
              app: bff
        {{- end }}
      ports:
        {{- range $port := $store.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- if and $hostCidr $store.hostPorts }}
    - from:
        - ipBlock:
            cidr: {{ $hostCidr }}
      ports:
        {{- range $port := $store.hostPorts }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.bff.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-bff
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: bff
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNs }}
      ports:
        - protocol: TCP
          port: {{ .Values.bff.port }}
    {{- if $hostCidr }}
    # Metrics and probes only. The browser-facing port is not open to the host network.
    - from:
        - ipBlock:
            cidr: {{ $hostCidr }}
      ports:
        - protocol: TCP
          port: {{ .Values.bff.adminPort }}
    {{- end }}
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: {{ .Values.api.port }}
    - to:
        - podSelector:
            matchLabels:
              app: redis
      ports:
        - protocol: TCP
          port: 6379
    {{- if .Values.keycloak.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: 8080
    {{- end }}
    {{- range $rule := .Values.networkPolicy.bffEgress }}
    - to:
        - ipBlock:
            cidr: {{ $rule.cidr }}
      ports:
        {{- range $port := $rule.ports }}
        - protocol: TCP
          port: {{ $port }}
        {{- end }}
    {{- end }}
{{- end }}
{{- if .Values.keycloak.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kp-keycloak
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app: keycloak
  # Egress stays default-deny: Keycloak has an embedded database and calls nothing but DNS.
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $ingressNs }}
        - podSelector:
            matchLabels:
              app: bff
        - podSelector:
            matchLabels:
              app: api
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- end }}
