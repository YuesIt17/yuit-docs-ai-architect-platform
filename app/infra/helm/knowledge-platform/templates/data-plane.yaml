{{- if .Values.postgres.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        kp.retailpartnerx.io/plane: data
    spec:
      {{- include "kp.podSecurity" (dict "uid" 70) | nindent 6 }}
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          {{- include "kp.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgres.user | quote }}
            # A subdirectory, because a volume root is not owned by the postgres user.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kp-secrets
                  key: POSTGRES_PASSWORD
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: kp-postgres-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
{{- end }}
---
{{- if .Values.neo4j.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: neo4j
  namespace: {{ .Values.namespace }}
  labels:
    app: neo4j
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: neo4j
  template:
    metadata:
      labels:
        app: neo4j
        kp.retailpartnerx.io/plane: data
        # The image entrypoint rewrites its config under /var/lib/neo4j at startup.
        kp.retailpartnerx.io/writable-rootfs: image-entrypoint-writes-config
    spec:
      {{- include "kp.podSecurity" (dict "uid" 7474) | nindent 6 }}
      # K8s service-link env NEO4J_PORT_* is mistaken for Neo4j config keys.
      enableServiceLinks: false
      containers:
        - name: neo4j
          image: {{ .Values.neo4j.image }}
          {{- include "kp.containerSecurity" (dict "readOnly" false) | nindent 10 }}
          env:
            - name: NEO4J_AUTH
              valueFrom:
                secretKeyRef:
                  name: kp-secrets
                  key: NEO4J_AUTH
            - name: NEO4J_server_config_strict__validation_enabled
              value: "false"
          ports:
            - containerPort: 7474
            - containerPort: 7687
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /data
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kp-neo4j-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: neo4j
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.neo4j.serviceType | default "ClusterIP" }}
  selector:
    app: neo4j
  ports:
    - name: http
      port: 7474
      {{- if and (eq (.Values.neo4j.serviceType | default "ClusterIP") "NodePort") .Values.neo4j.httpNodePort }}
      nodePort: {{ .Values.neo4j.httpNodePort }}
      {{- end }}
    - name: bolt
      port: 7687
{{- end }}
---
{{- if .Values.qdrant.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
  labels:
    app: qdrant
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: qdrant
  template:
    metadata:
      labels:
        app: qdrant
        kp.retailpartnerx.io/plane: data
        # Qdrant writes an init marker into its working directory.
        kp.retailpartnerx.io/writable-rootfs: app-writes-init-marker
    spec:
      {{- include "kp.podSecurity" (dict "uid" 1000) | nindent 6 }}
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          {{- include "kp.containerSecurity" (dict "readOnly" false) | nindent 10 }}
          ports:
            - containerPort: 6333
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          {{- end }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: kp-qdrant-data
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: qdrant
  ports:
    - port: 6333
{{- end }}
---
{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
  labels:
    app: redis
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
        kp.retailpartnerx.io/plane: data
    spec:
      {{- include "kp.podSecurity" (dict "uid" 999) | nindent 6 }}
      containers:
        - name: redis
          image: {{ .Values.redis.image }}
          {{- include "kp.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          ports:
            - containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: redis
  ports:
    - port: 6379
{{- end }}
---
{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
  labels:
    app: minio
    kp.retailpartnerx.io/plane: data
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
        kp.retailpartnerx.io/plane: data
        # The Bitnami entrypoint writes runtime config under /opt/bitnami.
        kp.retailpartnerx.io/writable-rootfs: image-entrypoint-writes-config
    spec:
      {{- include "kp.podSecurity" (dict "uid" 1001) | nindent 6 }}
      containers:
        - name: minio
          image: {{ .Values.minio.image }}
          {{- include "kp.containerSecurity" (dict "readOnly" false) | nindent 10 }}
          {{- if .Values.minio.args }}
          args: {{ .Values.minio.args | toJson }}
          {{- end }}
          env:
            - name: MINIO_ROOT_USER
              valueFrom:
                secretKeyRef:
                  name: kp-secrets
                  key: MINIO_ROOT_USER
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kp-secrets
                  key: MINIO_ROOT_PASSWORD
            - name: MINIO_DEFAULT_BUCKETS
              value: knowledge-platform
          ports:
            - containerPort: 9000
            - containerPort: 9001
          volumeMounts:
            - name: data
              mountPath: /bitnami/minio/data
            # The image makes these writable through group root, which this pod does not use.
            - name: runtime
              mountPath: /opt/bitnami/minio/tmp
              subPath: tmp
            - name: runtime
              mountPath: /opt/bitnami/minio/secrets
              subPath: secrets
            - name: runtime
              mountPath: /opt/bitnami/minio/log
              subPath: log
            - name: runtime
              mountPath: /.mc
              subPath: mc
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: kp-minio-data
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: runtime
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  type: {{ .Values.minio.serviceType | default "ClusterIP" }}
  selector:
    app: minio
  ports:
    - name: api
      port: 9000
    - name: console
      port: 9001
      {{- if and (eq (.Values.minio.serviceType | default "ClusterIP") "NodePort") .Values.minio.consoleNodePort }}
      nodePort: {{ .Values.minio.consoleNodePort }}
      {{- end }}
{{- end }}
