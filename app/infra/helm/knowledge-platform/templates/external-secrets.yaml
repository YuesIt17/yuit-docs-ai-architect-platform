{{- if eq .Values.secrets.provider "external-secrets" }}
{{- /* Requires External Secrets Operator and a configured Vault: see docs/infra/secrets.md. */ -}}
{{- $vault := .Values.secrets.vault }}
{{- $labels := include "kp.labels" . }}
{{- $ns := .Values.namespace }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kp-vault-reader
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: kp-vault
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  provider:
    vault:
      server: {{ $vault.server | quote }}
      path: {{ $vault.kvMount | quote }}
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: {{ $vault.role | quote }}
          serviceAccountRef:
            name: kp-vault-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kp-secrets
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  refreshInterval: {{ $vault.staticRefresh | quote }}
  secretStoreRef:
    name: kp-vault
    kind: SecretStore
  target:
    name: kp-secrets
    template:
      data:
        JWT_SECRET: "{{ `{{ .jwt_secret }}` }}"
        NEO4J_PASSWORD: "{{ `{{ .neo4j_password }}` }}"
        NEO4J_AUTH: "neo4j/{{ `{{ .neo4j_password }}` }}"
        MINIO_ROOT_USER: "{{ `{{ .minio_root_user }}` }}"
        MINIO_ROOT_PASSWORD: "{{ `{{ .minio_root_password }}` }}"
        POSTGRES_PASSWORD: "{{ `{{ .postgres_admin_password }}` }}"
  dataFrom:
    - extract:
        key: kp/platform
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: kp-postgres-credentials
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  path: {{ printf "/%s/creds/%s" $vault.databaseMount $vault.databaseRole | quote }}
  method: GET
  provider:
    server: {{ $vault.server | quote }}
    auth:
      kubernetes:
        mountPath: kubernetes
        role: {{ $vault.role | quote }}
        serviceAccountRef:
          name: kp-vault-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kp-postgres-dsn
  namespace: {{ $ns }}
  labels:
    {{- $labels | nindent 4 }}
spec:
  # Must be shorter than the Vault role's default_ttl, so new credentials arrive before the old ones expire.
  refreshInterval: {{ $vault.dynamicRefresh | quote }}
  target:
    name: kp-postgres-dsn
    template:
      data:
        dsn: "postgresql://{{ `{{ .username }}` }}:{{ `{{ .password }}` }}@postgres:5432/{{ .Values.postgres.database }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: kp-postgres-credentials
{{- end }}
