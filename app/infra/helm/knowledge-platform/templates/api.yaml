apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
    app: api
    kp.retailpartnerx.io/plane: control
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
        kp.retailpartnerx.io/plane: control
    spec:
      {{- include "kp.podSecurity" (dict "uid" 10001) | nindent 6 }}
      containers:
        - name: api
          image: {{ .Values.images.api }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          {{- include "kp.containerSecurity" (dict "readOnly" true) | nindent 10 }}
          ports:
            - containerPort: {{ .Values.api.port }}
          env:
            - name: LLM_PROVIDER
              value: {{ .Values.llm.provider | quote }}
            - name: LLM_MODEL
              value: {{ .Values.llm.model | quote }}
            - name: OPENAI_BASE_URL
              value: {{ .Values.llm.baseUrl | quote }}
            - name: STORE_BACKEND
              value: {{ .Values.api.env.STORE_BACKEND | quote }}
            - name: OCR_PROVIDER
              value: {{ .Values.api.env.OCR_PROVIDER | default "MOCK" | quote }}
            - name: EMBEDDING_PROVIDER
              value: {{ .Values.api.env.EMBEDDING_PROVIDER | quote }}
            {{- if .Values.bff.enabled }}
            # With the BFF, demo auth is off whatever the values say. The API refuses to start with both.
            - name: DEMO_AUTH_ENABLED
              value: "false"
            - name: OIDC_ISSUER
              value: {{ include "kp.oidcIssuer" . | quote }}
            - name: OIDC_AUDIENCE
              value: {{ .Values.bff.oidc.audience | quote }}
            - name: OIDC_JWKS_URL
              value: {{ printf "%s/protocol/openid-connect/certs" (include "kp.oidcInternalUrl" .) | quote }}
            {{- else }}
            - name: DEMO_AUTH_ENABLED
              value: {{ .Values.api.env.DEMO_AUTH_ENABLED | default "true" | quote }}
            {{- end }}
            - name: ENABLE_SEMANTIC_CACHE
              value: {{ .Values.api.env.ENABLE_SEMANTIC_CACHE | default "false" | quote }}
            - name: LLM_ALLOW_RUNTIME_URL_OVERRIDE
              value: {{ .Values.api.env.LLM_ALLOW_RUNTIME_URL_OVERRIDE | default "false" | quote }}
            - name: NEO4J_URI
              value: bolt://neo4j:7687
            - name: QDRANT_URL
              value: http://qdrant:6333
            - name: REDIS_URL
              value: redis://redis:6379/0
            - name: MINIO_ENDPOINT
              value: minio:9000
            {{- if eq .Values.secrets.provider "external-secrets" }}
            - name: POSTGRES_DSN_FILE
              value: /var/run/kp-postgres/dsn
            {{- else }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: kp-secrets
                  key: POSTGRES_DSN
            {{- end }}
            {{- include "kp.secretEnv" . | nindent 12 }}
            - name: JOB_BACKEND
              value: {{ if .Values.worker.enabled }}celery{{ else }}inline{{ end }}
            # The root filesystem is read-only; library caches go to the /tmp volume.
            - name: HOME
              value: /tmp
            # Compose Tempo on host; app wires OTLP/HTTP traces. Logs → Loki via Alloy (stdout JSON). Prom scrapes /metrics.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.api.env.OTEL_EXPORTER_OTLP_ENDPOINT | default "http://host.docker.internal:4318" | quote }}
            - name: OTEL_METRICS_EXPORTER
              value: "none"
            - name: OTEL_LOGS_EXPORTER
              value: "none"
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: object-store-cache
              mountPath: /app/data
            {{- if eq .Values.secrets.provider "external-secrets" }}
            - name: postgres-dsn
              mountPath: /var/run/kp-postgres
              readOnly: true
            {{- end }}
      volumes:
        {{- if eq .Values.secrets.provider "external-secrets" }}
        - name: postgres-dsn
          secret:
            secretName: kp-postgres-dsn
        {{- end }}
        - name: tmp
          emptyDir: {}
        - name: object-store-cache
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "kp.labels" . | nindent 4 }}
    app: api
spec:
  {{- /* With the BFF the API is never published, so it cannot be reached around the BFF. */}}
  {{- $apiServiceType := ternary "ClusterIP" (.Values.api.serviceType | default "ClusterIP") .Values.bff.enabled }}
  type: {{ $apiServiceType }}
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: {{ .Values.api.port }}
      {{- if and (eq $apiServiceType "NodePort") .Values.api.nodePort }}
      nodePort: {{ .Values.api.nodePort }}
      {{- end }}
