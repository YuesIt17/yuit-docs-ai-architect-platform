# LiteLLM proxy — gateway-multiprovider.
# Local aliases match gateway-local. Cloud entries are stubs: set env keys to exercise.
# Live Azure / Vertex / Bedrock calls are **not verified** until run with real credentials.
model_list:
  - model_name: chat-default
    litellm_params:
      model: ollama/qwen2.5:0.5b
      api_base: http://ollama:11434
  - model_name: chat-default
    litellm_params:
      model: openai/mock-graph-rag
      api_key: not-needed
      mock_response: "[gateway-failover] Based on the RetailPartnerX corporate knowledge base."
  - model_name: chat-mock
    litellm_params:
      model: openai/mock-graph-rag
      api_key: not-needed
      mock_response: "Based on the RetailPartnerX corporate knowledge base (gateway mock)."

